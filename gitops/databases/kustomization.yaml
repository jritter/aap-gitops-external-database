---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespace is created by the Application (CreateNamespace=true). Keeping a
  # Namespace manifest on OpenShift causes Argo CD to fight project.openshift.io/Project.
  - cluster.yaml
  - database-gateway.yaml
  - database-controller.yaml
  - database-hub.yaml
  - database-eda.yaml
  - database-metrics.yaml
  # CNPG role password Secrets (replace CHANGE_ME before/after first sync).
  - secrets/examples/aap-pg-aap-password.yaml
  - secrets/examples/aap-pg-ms-awx-readonly-password.yaml

---
# Pre-create in aap-postgres before the CNPG Cluster can provision the aap role.
# Replace CHANGE_ME with a real password (no single/double quotes or backslashes).
# Use the same password in the AAP unmanaged Secrets under gitops/aap/secrets/examples/.
#
#   oc apply -f gitops/databases/secrets/examples/aap-pg-aap-password.yaml
apiVersion: v1
kind: Secret
metadata:
  name: aap-pg-aap-password
  namespace: aap-postgres
  labels:
    app.kubernetes.io/name: aap-pg
    app.kubernetes.io/part-of: aap-gitops-external-database
type: kubernetes.io/basic-auth
stringData:
  username: aap
  password: CHANGE_ME

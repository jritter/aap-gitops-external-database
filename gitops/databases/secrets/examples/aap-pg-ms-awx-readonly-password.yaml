---
# Pre-create in aap-postgres for the metrics controller read-only role.
# Replace CHANGE_ME with a real password (no single/double quotes or backslashes).
# Use the same password in metrics-controller-readonly-configuration under
# gitops/aap/secrets/examples/.
#
#   oc apply -f gitops/databases/secrets/examples/aap-pg-ms-awx-readonly-password.yaml
#
# After the automation_controller database exists, grant SELECT (example):
#   oc -n aap-postgres exec -it aap-pg-1 -- psql -U postgres -d automation_controller \
#     -c 'GRANT SELECT ON ALL TABLES IN SCHEMA public TO ms_awx_readonly;'
#   oc -n aap-postgres exec -it aap-pg-1 -- psql -U postgres -d automation_controller \
#     -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO ms_awx_readonly;'
apiVersion: v1
kind: Secret
metadata:
  name: aap-pg-ms-awx-readonly-password
  namespace: aap-postgres
  labels:
    app.kubernetes.io/name: aap-pg
    app.kubernetes.io/part-of: aap-gitops-external-database
type: kubernetes.io/basic-auth
stringData:
  username: ms_awx_readonly
  password: CHANGE_ME

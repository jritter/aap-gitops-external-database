---
# Metrics read-only access to the controller database.
# Replace CHANGE_ME with the ms_awx_readonly role password.
#
#   oc apply -f gitops/aap/secrets/examples/metrics-controller-readonly-configuration.yaml
apiVersion: v1
kind: Secret
metadata:
  name: metrics-controller-readonly-configuration
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: metrics
type: Opaque
stringData:
  host: aap-pg-rw.aap-postgres.svc.cluster.local
  port: "5432"
  database: automation_controller
  username: ms_awx_readonly
  password: CHANGE_ME
  sslmode: prefer
  target_session_attrs: read-write
  type: unmanaged

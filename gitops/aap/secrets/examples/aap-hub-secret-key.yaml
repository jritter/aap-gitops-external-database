---
# Static Django SECRET_KEY for automation hub.
# Generate e.g.: python3 -c 'import secrets; print(secrets.token_urlsafe(50))'
apiVersion: v1
kind: Secret
metadata:
  name: aap-hub-secret-key
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: hub
type: Opaque
stringData:
  secret_key: CHANGE_ME_HUB_DJANGO_SECRET_KEY

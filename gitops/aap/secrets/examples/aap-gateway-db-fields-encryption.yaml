---
# Static DB fields encryption key for platform gateway
# (AnsibleAutomationPlatform.spec.db_fields_encryption_secret).
# Generate e.g.: python3 -c 'import secrets; print(secrets.token_urlsafe(50))'
apiVersion: v1
kind: Secret
metadata:
  name: aap-gateway-db-fields-encryption
  namespace: aap
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: gateway
type: Opaque
stringData:
  secret_key: CHANGE_ME_GATEWAY_SECRET_KEY

---
# Static DB fields encryption key for Event-Driven Ansible.
# Generate e.g.: python3 -c 'import secrets; print(secrets.token_urlsafe(50))'
# See: https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/2.4/html/deploying_the_red_hat_ansible_automation_platform_operator_on_openshift_container_platform/aap-migration#create-secret-key-secret_aap-migration
apiVersion: v1
kind: Secret
metadata:
  name: aap-eda-db-fields-encryption
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: eda
type: Opaque
stringData:
  secret_key: CHANGE_ME_EDA_SECRET_KEY

---
# Static encryption key for automation controller (SECRET_KEY).
# Keep this value stable across delete/redeploy if encrypted DB fields must remain
# readable. With PostDelete schema wipe, a fixed key still avoids regenerating a
# new operator-managed key on every install.
#
# Generate e.g.: python3 -c 'import secrets; print(secrets.token_urlsafe(50))'
# See: https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/2.4/html/deploying_the_red_hat_ansible_automation_platform_operator_on_openshift_container_platform/aap-migration#create-secret-key-secret_aap-migration
apiVersion: v1
kind: Secret
metadata:
  name: aap-controller-secret-key
  namespace: aap
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: controller
type: Opaque
stringData:
  secret_key: CHANGE_ME_CONTROLLER_SECRET_KEY

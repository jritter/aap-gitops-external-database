---
# Apply out-of-band after aap-pg is healthy. Replace CHANGE_ME with the aap role password.
# Hub DB must have the hstore extension (declared on the CNPG Database CR).
#
#   oc apply -f gitops/aap/secrets/examples/external-postgres-configuration-hub.yaml
apiVersion: v1
kind: Secret
metadata:
  name: external-postgres-configuration-hub
  namespace: aap
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: hub
type: Opaque
stringData:
  host: aap-pg-rw.aap-postgres.svc.cluster.local
  port: "5432"
  database: automation_hub
  username: aap
  password: CHANGE_ME
  sslmode: prefer
  target_session_attrs: read-write
  type: unmanaged

---
# Static Fernet key for automation hub DB field encryption
# (database_fields.symmetric.key / Pulp). Required to decrypt sensitive hub DB
# fields across migrations and redeploys.
#
# Generate a Fernet key e.g.:
#   python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
# Do not add trailing newlines or spaces when setting the value.
# See: https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/2.4/html/deploying_the_red_hat_ansible_automation_platform_operator_on_openshift_container_platform/aap-migration#create-secret-key-secret_aap-migration
apiVersion: v1
kind: Secret
metadata:
  name: aap-hub-db-fields-encryption
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: hub
type: Opaque
stringData:
  database_fields.symmetric.key: CHANGE_ME_HUB_DB_FIELDS_ENCRYPTION_KEY

---
# Metrics service R/W database secret. Apply out-of-band after aap-pg is healthy.
# Replace CHANGE_ME with the aap role password (needs CREATEDB — set on the CNPG role).
#
#   oc apply -f gitops/aap/secrets/examples/automation-platform-metrics-postgres-configuration.yaml
apiVersion: v1
kind: Secret
metadata:
  name: automation-platform-metrics-postgres-configuration
  namespace: aap
  labels:
    app.kubernetes.io/part-of: aap-gitops-external-database
    aap.ansible.com/component: metrics
type: Opaque
stringData:
  host: aap-pg-rw.aap-postgres.svc.cluster.local
  port: "5432"
  database: metrics_service
  username: aap
  password: CHANGE_ME
  sslmode: prefer
  target_session_attrs: read-write
  type: unmanaged

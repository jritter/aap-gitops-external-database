---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespace is created by the Application (CreateNamespace=true). Keeping a
  # Namespace manifest on OpenShift causes Argo CD to fight project.openshift.io/Project.
  - ansibleautomationplatform.yaml
# Password-bearing Secrets live under secrets/examples/ and are applied out-of-band
# so Argo CD does not overwrite real credentials.

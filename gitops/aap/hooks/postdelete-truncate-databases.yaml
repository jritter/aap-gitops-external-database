---
# PostDelete hook: after aap-platform resources are removed, wipe AAP-owned
# objects in every external database so redeploy can re-initialize schema.
#
# DROP TABLE alone is not enough (e.g. Hub/Pulp leaves collation
# pulp_ansible_semver). Resetting public schema clears tables, collations,
# types, functions, sequences, etc. hstore is recreated for Hub; CNPG also
# reconciles it via the Database CR.
#
# Runs in aap-postgres so it can use aap-pg-aap-password from aap-databases.
# Requires: aap-databases Application still present.
apiVersion: batch/v1
kind: Job
metadata:
  name: aap-postdelete-truncate-dbs
  namespace: aap-postgres
  labels:
    app.kubernetes.io/name: aap-postdelete-truncate-dbs
    app.kubernetes.io/part-of: aap-gitops-external-database
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-postdelete-truncate-dbs
        app.kubernetes.io/part-of: aap-gitops-external-database
    spec:
      restartPolicy: Never
      containers:
        - name: cleanup
          image: ghcr.io/cloudnative-pg/postgresql:15
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: aap-pg-rw.aap-postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: aap-pg-aap-password
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: aap-pg-aap-password
                  key: password
            - name: AAP_DATABASES
              value: platform_gateway automation_controller automation_hub automation_eda metrics_service
          command:
            - /bin/bash
            - -ec
            - |
              # Avoid PL/pgSQL dollar-quoting: Kubernetes turns $$ into $.
              cleanup_db() {
                local db="$1"
                echo "=== Resetting public schema in database: ${db} ==="
                # Recreate as the aap role so it owns public (no GRANT needed).
                psql -d "${db}" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS public CASCADE"
                psql -d "${db}" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA public"
                # Hub requires hstore; safe no-op on other databases.
                psql -d "${db}" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS hstore"

                echo "=== Cleaned database: ${db} ==="
              }

              for db in ${AAP_DATABASES}; do
                cleanup_db "${db}"
              done
              echo "=== All databases cleaned for schema re-initialization ==="
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
